services:
  backend:
    build: ./backend
    command: uvicorn src.app:app --host 0.0.0.0 --reload --port 8000
    container_name: backend
    restart: unless-stopped
    volumes:
      - ./backend:/backend
    env_file: ".env.dev"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend-db:
        condition: service_healthy
      backend-redis:
        condition: service_healthy
      backend-minio:
        condition: service_healthy

  backend-worker:
    build: ./backend
    command: [ 'celery', '-A', 'src.tasks.celery_app', 'worker', '-l', 'info' ]
    container_name: backend-worker
    restart: unless-stopped
    env_file: ".env.dev"
    volumes:
      - ./backend:/backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend-db:
        condition: service_healthy
      backend-redis:
        condition: service_healthy
      backend-minio:
        condition: service_healthy

  backend-db:
    image: postgres:latest
    container_name: backend-db
    restart: unless-stopped
    ports:
      - "5433:5433"
    env_file: ".env.dev"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p $$PGPORT"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - backend-db-volume:/var/lib/postgresql

  backend-redis:
    image: redis:latest
    container_name: backend-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-minio:
    image: minio/minio:latest
    container_name: backend-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: ".env.dev"
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - backend-minio-volume:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  backend-db-volume:
  backend-minio-volume:
